# render.yaml — DecisionFlow AI full-stack deployment
# Docs: https://render.com/docs/blueprint-spec
#
# This blueprint provisions:
#   - PostgreSQL database (Render managed)
#   - FastAPI web service (API + embedded Redis + Celery Worker & Beat in Docker)

databases:
  - name: decisionflow-db
    databaseName: decisionflow
    plan: free          # upgrade to starter ($7/mo) for production
    region: oregon

services:
  # ── FastAPI Web Service (FastAPI + Embedded Redis + Celery) ────────────────
  - type: web
    name: decisionflow-api
    runtime: docker
    region: oregon
    plan: free          # upgrade to starter ($7/mo) for production
    rootDir: Backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: decisionflow-db
          property: connectionString
      # Render auto-generates a secure 256-bit secret key on first deploy
      - key: SECRET_KEY
        generateValue: true
      # AI API keys
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Email SMTP settings (optional)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Public endpoints & CORS
      - key: API_PUBLIC_URL
        sync: false       # e.g. https://decisionflow-api.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false       # e.g. https://decisionflow-ai.pages.dev,http://localhost:8080
      - key: FRONTEND_URL
        sync: false       # e.g. https://decisionflowai.agrimrana2005.workers.dev
      # Cloud object storage (optional)
      - key: B2_ENDPOINT_URL
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false