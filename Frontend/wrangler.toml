# wrangler.toml — Cloudflare Pages/Workers deployment for DecisionFlow AI Frontend
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "decisionflow-ai"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

main = "dist/server/server.js"

[assets]
directory = "dist/client"
binding = "ASSETS"

[vars]
# Set VITE_API_BASE_URL in the Cloudflare dashboard under Settings > Variables
# e.g. VITE_API_BASE_URL = "https://decisionflow-api.onrender.com"